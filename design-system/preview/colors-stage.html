<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card" style="background: #0B0F0D; color: #F9F7F4; background-image: radial-gradient(ellipse at 30% 0%, rgba(22,101,52,0.15), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(180,83,9,0.08), transparent 55%);">
  <div class="row" style="gap: 14px; align-items: center;">
    <span style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.4);">Stage palette · Modo Apresentação</span>
  </div>
  <div class="row" style="gap: 12px; align-items: stretch;">
    <div style="flex: 1; padding: 10px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;">
      <div style="height: 36px; background: #0B0F0D; border: 1px solid rgba(255,255,255,0.06); border-radius: 4px;"></div>
      <div style="margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.7);">Stage</div>
      <div class="mono" style="font-size: 10px; color: rgba(255,255,255,0.4);">#0B0F0D</div>
    </div>
    <div style="flex: 1; padding: 10px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;">
      <div style="height: 36px; background: #F9F7F4; border-radius: 4px;"></div>
      <div style="margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.7);">Parchment text</div>
      <div class="mono" style="font-size: 10px; color: rgba(255,255,255,0.4);">#F9F7F4</div>
    </div>
    <div style="flex: 1; padding: 10px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;">
      <div style="height: 36px; background: #86EFAC; border-radius: 4px;"></div>
      <div style="margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.7);">Sage glow</div>
      <div class="mono" style="font-size: 10px; color: rgba(255,255,255,0.4);">#86EFAC</div>
    </div>
    <div style="flex: 1; padding: 10px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;">
      <div style="height: 36px; background: #D6A05F; border-radius: 4px;"></div>
      <div style="margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.7);">Gold lift</div>
      <div class="mono" style="font-size: 10px; color: rgba(255,255,255,0.4);">#D6A05F</div>
    </div>
  </div>
  <div style="color: rgba(255,255,255,0.55); font-size: 12px; line-height: 1.55; padding-top: 4px;">
    Dark mode lives only in <em style="font-family:var(--vox-font-display);">Modo Apresentação</em>. Two radial glows (forest top-left, gold bottom-right) sit at &lt;15% opacity.
  </div>
</div>
</body></html>
