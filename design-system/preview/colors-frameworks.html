<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_card.css" />
</head>

<body>
  <div class="card">
    <div class="eyebrow">Framework accents, closed set</div>
    <div class="swatch-row" style="grid-template-columns: repeat(6, 1fr); gap: 12px;">
      <div class="swatch">
        <div class="swatch-chip" style="background: #166534; height: 44px;"></div>
        <div>
          <div class="swatch-name">Expositivo</div>
          <div class="swatch-token">#166534</div>
        </div>
      </div>
      <div class="swatch">
        <div class="swatch-chip" style="background: #0D7C7C; height: 44px;"></div>
        <div>
          <div class="swatch-name">Textual</div>
          <div class="swatch-token">#0D7C7C</div>
        </div>
      </div>
      <div class="swatch">
        <div class="swatch-chip" style="background: #6D28D9; height: 44px;"></div>
        <div>
          <div class="swatch-name">Narrativo</div>
          <div class="swatch-token">#6D28D9</div>
        </div>
      </div>
      <div class="swatch">
        <div class="swatch-chip" style="background: #B45309; height: 44px;"></div>
        <div>
          <div class="swatch-name">Temático</div>
          <div class="swatch-token">#B45309</div>
        </div>
      </div>
      <div class="swatch">
        <div class="swatch-chip" style="background: #BE123C; height: 44px;"></div>
        <div>
          <div class="swatch-name">Tópico</div>
          <div class="swatch-token">#BE123C</div>
        </div>
      </div>
      <div class="swatch">
        <div class="swatch-chip" style="background: #475569; height: 44px;"></div>
        <div>
          <div class="swatch-name">Livre</div>
          <div class="swatch-token">#475569</div>
        </div>
      </div>
    </div>
    <div class="note" style="padding-top: 4px;">Used only as chromatic anchors, badges, outline rails, small dots. Never
      as flood fill behind body text.</div>
  </div>
</body>

</html>
