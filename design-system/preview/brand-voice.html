<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">Voice & tone — quiet authority</div>
  <div class="row" style="gap: 18px; align-items: stretch;">
    <div class="col" style="flex: 1; gap: 8px; padding: 14px; background: rgba(22,101,52,0.05); border-radius: 8px; border-left: 3px solid var(--vox-forest);">
      <span style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vox-forest);">Do</span>
      <div style="font-family: var(--vox-font-display); font-size: 16px; line-height: 1.4; color: var(--vox-ink);">Bom dia, Pr. Edmundo.</div>
      <div style="color: var(--vox-prose); font-size: 12.5px;">Novo sermão</div>
      <div style="color: var(--vox-prose); font-size: 12.5px;">salvo há 12 segundos</div>
      <div style="color: var(--vox-prose); font-size: 12.5px;">Pronto para começar</div>
    </div>
    <div class="col" style="flex: 1; gap: 8px; padding: 14px; background: rgba(225,29,72,0.04); border-radius: 8px; border-left: 3px solid var(--vox-destructive);">
      <span style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vox-destructive);">Don't</span>
      <div style="font-family: var(--vox-font-display); font-size: 16px; line-height: 1.4; color: var(--vox-muted); text-decoration: line-through;">Hey Pastor! 👋</div>
      <div style="color: var(--vox-muted); font-size: 12.5px; text-decoration: line-through;">Criar Novo Sermão Agora ✨</div>
      <div style="color: var(--vox-muted); font-size: 12.5px; text-decoration: line-through;">✓ Saved!</div>
      <div style="color: var(--vox-muted); font-size: 12.5px; text-decoration: line-through;">You're all set! 🔥</div>
    </div>
  </div>
  <div class="note" style="padding-top: 4px;">Sentence case. Você (formal-warm). No emoji. No "transform / elevate / seamless / next-gen / unlock / magic."</div>
</div>
</body></html>
