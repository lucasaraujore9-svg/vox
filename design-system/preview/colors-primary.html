<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">Primary accents</div>
  <div class="swatch-row" style="grid-template-columns: repeat(4, 1fr);">
    <div class="swatch">
      <div class="swatch-chip" style="background: #166534;"></div>
      <div>
        <div class="swatch-name">Forest Deep</div>
        <div class="swatch-token">#166534 · --vox-forest</div>
        <div class="note" style="font-size: 11.5px;">Primary action, active state</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background: #15803D;"></div>
      <div>
        <div class="swatch-name">Forest Mid</div>
        <div class="swatch-token">#15803D · --vox-forest-mid</div>
        <div class="note" style="font-size: 11.5px;">Hover only</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background: rgba(22,101,52,0.14);"></div>
      <div>
        <div class="swatch-name">Forest Tint</div>
        <div class="swatch-token">--vox-forest-tint</div>
        <div class="note" style="font-size: 11.5px;">Selection, soft fill</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background: rgba(22,101,52,0.08);"></div>
      <div>
        <div class="swatch-name">Forest Soft</div>
        <div class="swatch-token">--vox-forest-soft</div>
        <div class="note" style="font-size: 11.5px;">Sidebar active, badge bg</div>
      </div>
    </div>
  </div>
</div>
</body></html>
