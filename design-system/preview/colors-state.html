<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">State</div>
  <div class="swatch-row" style="grid-template-columns: repeat(3, 1fr); gap: 14px;">
    <div class="swatch">
      <div class="swatch-chip" style="background: #10B981;"></div>
      <div>
        <div class="swatch-name">Emerald — Success</div>
        <div class="swatch-token">#10B981 · --vox-success</div>
        <div class="note" style="font-size: 11.5px;">Saved indicators, completed steps</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background: #E11D48;"></div>
      <div>
        <div class="swatch-name">Deep Rose — Destructive</div>
        <div class="swatch-token">#E11D48 · --vox-destructive</div>
        <div class="note" style="font-size: 11.5px;">Delete confirmations, errors</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background: #0D7C7C;"></div>
      <div>
        <div class="swatch-name">Teal Sage — Info</div>
        <div class="swatch-token">#0D7C7C · --vox-info</div>
        <div class="note" style="font-size: 11.5px;">Reuses Textual framework hue</div>
      </div>
    </div>
  </div>
</div>
</body></html>
