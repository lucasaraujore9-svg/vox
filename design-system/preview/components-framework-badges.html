<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">Framework badges</div>
  <div class="row" style="gap: 8px; flex-wrap: wrap;">
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 4px; background: rgba(22,101,52,0.10); color: #166534; font-family: var(--vox-font-ui); font-weight: 500; font-size: 11.5px; letter-spacing: 0.02em;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #166534; box-shadow: 0 0 0 2px rgba(22,101,52,0.18);"></span>Expositivo
    </span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 4px; background: rgba(13,124,124,0.10); color: #0D7C7C; font-family: var(--vox-font-ui); font-weight: 500; font-size: 11.5px; letter-spacing: 0.02em;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #0D7C7C; box-shadow: 0 0 0 2px rgba(13,124,124,0.18);"></span>Textual
    </span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 4px; background: rgba(109,40,217,0.10); color: #6D28D9; font-family: var(--vox-font-ui); font-weight: 500; font-size: 11.5px; letter-spacing: 0.02em;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #6D28D9; box-shadow: 0 0 0 2px rgba(109,40,217,0.18);"></span>Narrativo
    </span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 4px; background: rgba(180,83,9,0.10); color: #B45309; font-family: var(--vox-font-ui); font-weight: 500; font-size: 11.5px; letter-spacing: 0.02em;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #B45309; box-shadow: 0 0 0 2px rgba(180,83,9,0.18);"></span>Temático
    </span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 4px; background: rgba(190,18,60,0.10); color: #BE123C; font-family: var(--vox-font-ui); font-weight: 500; font-size: 11.5px; letter-spacing: 0.02em;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #BE123C; box-shadow: 0 0 0 2px rgba(190,18,60,0.18);"></span>Tópico
    </span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 4px; background: rgba(71,85,105,0.10); color: #475569; font-family: var(--vox-font-ui); font-weight: 500; font-size: 11.5px; letter-spacing: 0.02em;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #475569; box-shadow: 0 0 0 2px rgba(71,85,105,0.18);"></span>Livre
    </span>
  </div>
  <div class="note" style="padding-top: 4px;">24px tall, 4px radius. Dot uses a 2px transparent ring to feel set in paper.</div>
</div>
</body></html>
