<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">Input fields</div>
  <label class="col" style="gap: 6px;">
    <span style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vox-prose);">Referência bíblica</span>
    <input value="Tiago 1:22—25" style="width: 100%; height: 40px; padding: 0 12px; background: #fff; border: 1.5px solid rgba(180,188,200,0.65); border-radius: 8px; font: 400 14px var(--vox-font-mono); color: var(--vox-ink); outline: none;"/>
    <span class="note" style="font-size: 12px;">Use travessão para faixa de versículos.</span>
  </label>
  <label class="col" style="gap: 6px;">
    <span style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vox-prose);">Título do sermão · focus</span>
    <input value="Ouvir e fazer" style="width: 100%; height: 48px; padding: 0 14px; background: #fff; border: 1.5px solid var(--vox-forest); border-radius: 8px; box-shadow: 0 0 0 3px rgba(22,101,52,0.08); font: 400 17px var(--vox-font-display); color: var(--vox-ink); letter-spacing: -0.005em; outline: none;"/>
  </label>
</div>
</body></html>
