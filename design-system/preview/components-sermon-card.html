<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card" style="background: var(--vox-bg);">
  <div class="eyebrow">Sermon card</div>
  <article style="position: relative; padding: 22px; background: #fff; border: 1px solid rgba(226,232,240,0.7); border-radius: 12px; box-shadow: 0 1px 0 rgba(22,101,52,0.04), 0 4px 24px rgba(22,101,52,0.06); display: flex; flex-direction: column; gap: 14px;">
    <span style="position: absolute; top: 0; left: 22px; right: 22px; height: 2px; background: #6D28D9; opacity: 0.7; border-radius: 999px;"></span>
    <div class="row" style="justify-content: space-between; align-items: center;">
      <span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 4px; background: rgba(109,40,217,0.10); color: #6D28D9; font-size: 10.5px; font-weight: 500;">
        <span style="width: 5px; height: 5px; border-radius: 50%; background: #6D28D9;"></span>Narrativo
      </span>
      <span class="mono" style="color: var(--vox-gold); font-size: 11.5px;">Lucas 10:25,37</span>
    </div>
    <h3 style="margin: 0; font-family: var(--vox-font-display); font-weight: 600; font-size: 19px; line-height: 1.25; letter-spacing: -0.01em; color: var(--vox-ink); text-wrap: balance;">Quem é o meu próximo?</h3>
    <div style="height: 4px; background: rgba(180,188,200,0.5); border-radius: 999px; overflow: hidden;">
      <div style="width: 35%; height: 100%; background: var(--vox-forest);"></div>
    </div>
    <div class="row" style="justify-content: space-between; padding-top: 4px;">
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; background: rgba(22,101,52,0.08); color: var(--vox-forest); font-size: 11px; font-weight: 500;">
        <span style="width: 5px; height: 5px; border-radius: 50%; background: currentColor;"></span>Em rascunho
      </span>
      <span class="mono" style="color: var(--vox-muted); font-size: 11px;">9 de maio · 08:15</span>
    </div>
  </article>
</div>
</body></html>
