<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">Corner radii</div>
  <div class="row" style="gap: 18px; align-items: flex-end;">
    <div class="col" style="align-items: center; gap: 8px;">
      <div style="width: 60px; height: 60px; background: var(--vox-forest); border-radius: 4px;"></div>
      <div style="text-align: center;">
        <div class="swatch-name" style="font-size: 11.5px;">4px · Badge</div>
        <div class="swatch-token">--vox-r-badge</div>
      </div>
    </div>
    <div class="col" style="align-items: center; gap: 8px;">
      <div style="width: 60px; height: 60px; background: var(--vox-forest); border-radius: 8px;"></div>
      <div style="text-align: center;">
        <div class="swatch-name" style="font-size: 11.5px;">8px · Input / Button</div>
        <div class="swatch-token">--vox-r-input</div>
      </div>
    </div>
    <div class="col" style="align-items: center; gap: 8px;">
      <div style="width: 60px; height: 60px; background: var(--vox-forest); border-radius: 12px;"></div>
      <div style="text-align: center;">
        <div class="swatch-name" style="font-size: 11.5px;">12px · Card</div>
        <div class="swatch-token">--vox-r-card</div>
      </div>
    </div>
    <div class="col" style="align-items: center; gap: 8px;">
      <div style="width: 60px; height: 30px; background: var(--vox-forest); border-radius: 999px;"></div>
      <div style="text-align: center;">
        <div class="swatch-name" style="font-size: 11.5px;">Pill · Chip / Progress</div>
        <div class="swatch-token">--vox-r-pill</div>
      </div>
    </div>
    <div class="note" style="margin-left: 8px; max-width: 220px;">Never fully rounded buttons. Pills only for filter chips and progress bars.</div>
  </div>
</div>
</body></html>
