<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_card.css" />
</head>

<body>
  <div class="card">
    <div class="eyebrow">Secondary, Scripture Gold</div>
    <div class="row" style="gap: 20px; align-items: center;">
      <div class="swatch" style="flex: 0 0 140px;">
        <div class="swatch-chip" style="background: #B45309;"></div>
        <div>
          <div class="swatch-name">Scripture Gold</div>
          <div class="swatch-token">#B45309 · --vox-gold</div>
        </div>
      </div>
      <div class="swatch" style="flex: 0 0 140px;">
        <div class="swatch-chip" style="background: rgba(180,83,9,0.10);"></div>
        <div>
          <div class="swatch-name">Gold Soft</div>
          <div class="swatch-token">--vox-gold-soft</div>
        </div>
      </div>
      <div
        style="flex: 1; padding-left: 12px; border-left: 1px dashed rgba(180,188,200,0.6); display: flex; flex-direction: column; gap: 8px;">
        <span class="note" style="color: var(--vox-ink); font-weight: 500;">Used sparingly to mark authority</span>
        <span class="mono" style="color: #B45309; font-size: 14px;">Romanos 5:1,11</span>
        <span class="mono" style="color: #B45309; font-size: 11.5px;">Tiago 1:22 · ACF</span>
        <span class="note" style="font-size: 12px;">Never as flood fill. Reserved for bible references and
          version-marker callouts.</span>
      </div>
    </div>
  </div>
</body>

</html>
