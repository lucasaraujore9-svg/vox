<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_card.css" />
</head>

<body>
  <div class="card" style="background: var(--vox-bg);">
    <div class="eyebrow">Dividers, hairline & dashed</div>
    <div class="col" style="gap: 16px; padding: 10px 0;">
      <div>
        <div style="height: 1px; background: rgba(226,232,240,0.7);"></div>
        <div class="row" style="gap: 12px; padding-top: 8px;">
          <span class="swatch-name" style="font-size: 12px;">Hairline solid</span>
          <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">1px solid --vox-whisper</span>
        </div>
      </div>
      <div>
        <div style="height: 0; border-top: 1px dashed rgba(180,188,200,0.65);"></div>
        <div class="row" style="gap: 12px; padding-top: 8px;">
          <span class="swatch-name" style="font-size: 12px;">Dashed micro-section</span>
          <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">1px dashed --vox-whisper-strong</span>
        </div>
      </div>
      <div>
        <div style="height: 1px; background: rgba(180,188,200,0.65);"></div>
        <div class="row" style="gap: 12px; padding-top: 8px;">
          <span class="swatch-name" style="font-size: 12px;">Stronger separation</span>
          <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">1px solid --vox-whisper-strong</span>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
