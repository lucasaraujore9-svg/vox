<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">Ink — text on parchment</div>
  <div class="swatch-row" style="grid-template-columns: repeat(5, 1fr);">
    <div class="swatch">
      <div class="swatch-chip" style="background: #18181B;"></div>
      <div>
        <div class="swatch-name">Charcoal Ink</div>
        <div class="swatch-token">#18181B · --vox-ink</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background: #4B5563;"></div>
      <div>
        <div class="swatch-name">Slate Prose</div>
        <div class="swatch-token">#4B5563 · --vox-prose</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background: #9CA3AF;"></div>
      <div>
        <div class="swatch-name">Muted Sage</div>
        <div class="swatch-token">#9CA3AF · --vox-muted</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background: rgba(180,188,200,0.65);"></div>
      <div>
        <div class="swatch-name">Whisper strong</div>
        <div class="swatch-token">--vox-whisper-strong</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background: rgba(226,232,240,0.7);"></div>
      <div>
        <div class="swatch-name">Whisper</div>
        <div class="swatch-token">--vox-whisper</div>
      </div>
    </div>
  </div>
  <div class="note" style="padding-top: 4px;">Never pure black. Charcoal carries enough warmth to sit on parchment without metallic glare.</div>
</div>
</body></html>
