<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_card.css" />
</head>

<body>
  <div class="card" style="background: var(--vox-bg);">
    <div class="eyebrow">Shadows, warm, with green undertone</div>
    <div class="row" style="gap: 18px; align-items: stretch; padding: 8px 0 18px;">
      <div
        style="flex: 1; height: 70px; background: #fff; border: 1px solid rgba(226,232,240,0.7); border-radius: 12px; box-shadow: 0 1px 0 rgba(22,101,52,0.04), 0 4px 24px rgba(22,101,52,0.06); display: flex; align-items: center; justify-content: center;">
        <span class="note" style="font-weight: 500; color: var(--vox-ink);">Card resting</span>
      </div>
      <div
        style="flex: 1; height: 70px; background: #fff; border: 1px solid rgba(22,101,52,0.18); border-radius: 12px; box-shadow: 0 2px 0 rgba(22,101,52,0.05), 0 12px 32px rgba(22,101,52,0.10); display: flex; align-items: center; justify-content: center;">
        <span class="note" style="font-weight: 500; color: var(--vox-ink);">Card hover</span>
      </div>
      <div
        style="flex: 1; height: 70px; background: #fff; border: 1px solid rgba(180,188,200,0.65); border-radius: 12px; box-shadow: 0 24px 64px rgba(22,40,30,0.16), 0 2px 8px rgba(22,40,30,0.08); display: flex; align-items: center; justify-content: center;">
        <span class="note" style="font-weight: 500; color: var(--vox-ink);">Overlay</span>
      </div>
    </div>
    <div class="note">Shadows read as "paper resting on wood," not floating glass. Always tinted toward forest, never
      neutral gray.</div>
  </div>
</body>

</html>
