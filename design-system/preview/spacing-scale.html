<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">Spacing — 4px base grid</div>
  <div class="row" style="align-items: flex-end; gap: 14px; padding: 8px 0;">
    <div class="col" style="align-items: center; gap: 6px;">
      <div style="width: 4px; height: 28px; background: var(--vox-forest);"></div>
      <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">4 · sp-1</span>
    </div>
    <div class="col" style="align-items: center; gap: 6px;">
      <div style="width: 8px; height: 28px; background: var(--vox-forest);"></div>
      <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">8 · sp-2</span>
    </div>
    <div class="col" style="align-items: center; gap: 6px;">
      <div style="width: 12px; height: 28px; background: var(--vox-forest);"></div>
      <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">12 · sp-3</span>
    </div>
    <div class="col" style="align-items: center; gap: 6px;">
      <div style="width: 16px; height: 28px; background: var(--vox-forest);"></div>
      <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">16 · sp-4</span>
    </div>
    <div class="col" style="align-items: center; gap: 6px;">
      <div style="width: 24px; height: 28px; background: var(--vox-forest);"></div>
      <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">24 · sp-6</span>
    </div>
    <div class="col" style="align-items: center; gap: 6px;">
      <div style="width: 32px; height: 28px; background: var(--vox-forest);"></div>
      <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">32 · sp-8</span>
    </div>
    <div class="col" style="align-items: center; gap: 6px;">
      <div style="width: 48px; height: 28px; background: var(--vox-forest);"></div>
      <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">48 · sp-12</span>
    </div>
    <div class="col" style="align-items: center; gap: 6px;">
      <div style="width: 64px; height: 28px; background: var(--vox-forest);"></div>
      <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">64 · sp-16</span>
    </div>
  </div>
  <div class="note" style="padding-top: 4px;">Card padding 22–28. Element gaps within cards 14–18. Page padding 32–48 desktop.</div>
</div>
</body></html>
