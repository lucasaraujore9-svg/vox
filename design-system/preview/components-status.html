<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">Status pills</div>
  <div class="row" style="gap: 12px; flex-wrap: wrap;">
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; background: rgba(75,85,99,0.08); color: var(--vox-prose); font-size: 11px; font-weight: 500; letter-spacing: 0.1px;">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: currentColor;"></span>Pregado
    </span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; background: rgba(22,101,52,0.08); color: var(--vox-forest); font-size: 11px; font-weight: 500; letter-spacing: 0.1px;">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: currentColor;"></span>Em rascunho
    </span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; background: rgba(180,83,9,0.10); color: var(--vox-gold); font-size: 11px; font-weight: 500; letter-spacing: 0.1px;">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: currentColor;"></span>Esboço
    </span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; color: var(--vox-muted); font-size: 11px; font-weight: 500;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--vox-success);"></span>
      <span class="mono" style="font-size: 11px;">salvo há 12s</span>
    </span>
  </div>
  <div class="note" style="padding-top: 4px;">22px height, 4px radius. Tiny solid dot + soft tint bg. Singular states only — never stacked.</div>
</div>
</body></html>
