<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card" style="gap: 12px;">
  <div class="eyebrow">Scripture block</div>
  <div style="position: relative; padding: 18px 22px; background: #fff; border: 1px solid rgba(226,232,240,0.7); border-left: 3px solid #B45309; border-radius: 10px;">
    <span style="position: absolute; top: 10px; right: 14px; font-family: var(--vox-font-mono); font-size: 10.5px; color: var(--vox-muted);">Tiago 1:22 · ACF</span>
    <div style="font-family: var(--vox-font-display); font-style: italic; font-size: 15px; line-height: 1.7; color: var(--vox-ink); font-weight: 400;">
      “Sede cumpridores da palavra e não somente ouvintes, enganando-vos a vós mesmos.”
    </div>
  </div>
  <div class="note" style="padding-top: 4px;">Fraunces italic 400, 1.7 line-height. Left rail in Scripture Gold. Ref in mono in top corner.</div>
</div>
</body></html>
