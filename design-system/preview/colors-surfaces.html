<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_card.css" />
</head>

<body>
  <div class="card">
    <div class="eyebrow">Surfaces, warm, paper-forward</div>
    <div class="swatch-row" style="grid-template-columns: repeat(4, 1fr);">
      <div class="swatch">
        <div class="swatch-chip" style="background: #F9F7F4;"></div>
        <div>
          <div class="swatch-name">Parchment Canvas</div>
          <div class="swatch-token">#F9F7F4 · --vox-bg</div>
        </div>
      </div>
      <div class="swatch">
        <div class="swatch-chip" style="background: #FFFFFF;"></div>
        <div>
          <div class="swatch-name">Pure White</div>
          <div class="swatch-token">#FFFFFF · --vox-surface</div>
        </div>
      </div>
      <div class="swatch">
        <div class="swatch-chip" style="background: #FEFCF9;"></div>
        <div>
          <div class="swatch-name">Linen</div>
          <div class="swatch-token">#FEFCF9 · --vox-surface-elev</div>
        </div>
      </div>
      <div class="swatch">
        <div class="swatch-chip" style="background: #0B0F0D;"></div>
        <div>
          <div class="swatch-name">Stage</div>
          <div class="swatch-token">#0B0F0D · --vox-stage-bg</div>
        </div>
      </div>
    </div>
    <div class="note" style="padding-top: 4px;">Stack subtly: parchment under linen under white. Stage is used only in
      Modo Apresentação.</div>
  </div>
</body>

</html>
