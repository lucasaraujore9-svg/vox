<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_card.css" />
</head>

<body>
  <div class="card" style="background: var(--vox-bg);">
    <div class="eyebrow">Stat card, soft, no metrics theater</div>
    <div class="row" style="gap: 12px; align-items: stretch;">
      <div
        style="flex: 1.4; padding: 18px; background: #fff; border: 1px solid rgba(226,232,240,0.7); border-radius: 12px; box-shadow: 0 1px 0 rgba(22,101,52,0.04), 0 4px 24px rgba(22,101,52,0.06); display: flex; flex-direction: column; gap: 12px;">
        <div class="row" style="justify-content: space-between; align-items: baseline;">
          <div>
            <span
              style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vox-prose);">Sequência
              de estudo</span>
            <div class="row" style="gap: 6px; align-items: baseline; margin-top: 4px;">
              <span
                style="font-family: var(--vox-font-display); font-weight: 600; font-size: 32px; line-height: 1; color: var(--vox-forest); letter-spacing: -0.01em;">9</span>
              <span style="color: var(--vox-prose); font-size: 12px;">dias seguidos</span>
            </div>
          </div>
          <span class="mono" style="font-size: 10.5px; color: var(--vox-muted);">últimas 3 semanas</span>
        </div>
        <div class="row" style="gap: 3px; align-items: flex-end;">
          <span style="flex:1;height:18px;border-radius:2px;background:rgba(22,101,52,0.14)"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:rgba(22,101,52,0.14)"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:rgba(22,101,52,0.14)"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:rgba(22,101,52,0.14)"></span>
          <span style="flex:1;height:6px;border-radius:2px;background:rgba(180,188,200,0.65)"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:rgba(22,101,52,0.14)"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:rgba(22,101,52,0.14)"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:rgba(22,101,52,0.14)"></span>
          <span style="flex:1;height:6px;border-radius:2px;background:rgba(180,188,200,0.65)"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:#166534"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:#166534"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:#166534"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:#166534"></span>
          <span style="flex:1;height:18px;border-radius:2px;background:#166534"></span>
        </div>
      </div>
      <div
        style="flex: 1; padding: 18px; background: #fff; border: 1px solid rgba(226,232,240,0.7); border-radius: 12px; box-shadow: 0 1px 0 rgba(22,101,52,0.04), 0 4px 24px rgba(22,101,52,0.06); display: flex; flex-direction: column; gap: 4px;">
        <span
          style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vox-prose);">Manuscritos
          em andamento</span>
        <span
          style="font-family: var(--vox-font-display); font-weight: 700; font-size: 32px; line-height: 1; color: var(--vox-forest); letter-spacing: -0.01em; margin-top: 6px;">2</span>
        <span style="color: var(--vox-muted); font-size: 11.5px; margin-top: auto; padding-top: 6px;">Tiago 1 · Lucas
          18</span>
      </div>
    </div>
  </div>
</body>

</html>
