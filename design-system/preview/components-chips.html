<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card">
  <div class="eyebrow">Filter chips</div>
  <div class="row" style="gap: 8px; flex-wrap: wrap;">
    <button style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:var(--vox-forest);border:1px solid var(--vox-forest);border-radius:999px;color:#fff;font-size:12.5px;font-weight:500;cursor:default;">
      Todos
      <span class="mono" style="font-size:10.5px;opacity:.8;">8</span>
    </button>
    <button style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:transparent;border:1px solid rgba(180,188,200,0.65);border-radius:999px;color:var(--vox-prose);font-size:12.5px;font-weight:500;cursor:default;">
      Em rascunho
      <span class="mono" style="font-size:10.5px;opacity:.6;">4</span>
    </button>
    <button style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:transparent;border:1px solid rgba(180,188,200,0.65);border-radius:999px;color:var(--vox-prose);font-size:12.5px;font-weight:500;cursor:default;">
      <span style="width:7px;height:7px;border-radius:50%;background:#6D28D9;"></span>Narrativo
    </button>
    <button style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:transparent;border:1px solid rgba(180,188,200,0.65);border-radius:999px;color:var(--vox-prose);font-size:12.5px;font-weight:500;cursor:default;">
      <span style="width:7px;height:7px;border-radius:50%;background:#B45309;"></span>Temático
    </button>
    <button style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:transparent;border:1px solid rgba(180,188,200,0.65);border-radius:999px;color:var(--vox-prose);font-size:12.5px;font-weight:500;cursor:default;">
      <span style="width:7px;height:7px;border-radius:50%;background:#475569;"></span>Livre
    </button>
  </div>
  <div class="note" style="padding-top: 4px;">Pill (999px). 30px tall. Active forest fill. Dot for framework chips uses framework color.</div>
</div>
</body></html>
