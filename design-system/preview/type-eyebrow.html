<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/></head>
<body>
<div class="card" style="gap: 14px;">
  <div class="eyebrow">Eyebrow labels — sectional context</div>
  <div class="row" style="gap: 32px; align-items: flex-start;">
    <div class="col" style="gap: 4px;">
      <span style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--vox-muted);">Sequência de estudo</span>
      <span style="font-family: var(--vox-font-display); font-weight: 600; font-size: 36px; line-height: 1; color: var(--vox-forest); letter-spacing: -0.01em;">9</span>
      <span class="note" style="font-size: 12px;">dias seguidos</span>
    </div>
    <div class="col" style="gap: 4px;">
      <span style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--vox-muted);">Trabalho</span>
      <span style="font-family: var(--vox-font-display); font-weight: 600; font-size: 22px; line-height: 1.2; color: var(--vox-ink); letter-spacing: -0.01em;">Em rascunho</span>
    </div>
    <div class="col" style="gap: 4px;">
      <span style="font-family: var(--vox-font-ui); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vox-muted);">Estrutura</span>
      <span class="note" style="font-size: 12px;">10 blocos</span>
    </div>
  </div>
  <div class="note" style="padding-top: 8px;">Uppercase, 0.12em tracked. Marks "this is the kind of thing below" without competing.</div>
</div>
</body></html>
